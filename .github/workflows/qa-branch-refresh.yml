name: Refresh QA branch from production

on:
  schedule:
    # Once a day. GitHub Actions cron is UTC — adjust the hour to taste.
    - cron: "0 9 * * *"
  workflow_dispatch: {}

jobs:
  reset-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: neondatabase/reset-branch-action@v1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: qa
          parent: true
          api_key: ${{ secrets.NEON_API_KEY }}
