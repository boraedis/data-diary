name: Refresh QA branch from production

on:
  schedule:
    # Once a day. GitHub Actions cron is UTC — adjust the hour to taste.
    - cron: "0 9 * * *"
  workflow_dispatch: {}

jobs:
  reset-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Reset QA branch to production parent
        run: |
          neonctl branches reset qa \
            --project-id ${{ vars.NEON_PROJECT_ID }} \
            --role-name neondb_owner
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
